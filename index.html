<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Waves — Physics Simulation</title>
  <!-- Google Fonts matching reference typography: retro script display + clean geometric/monospace UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Shrikhand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       GLOBAL RESET & VARIABLES
       ========================================================================== */
    :root {
      --bg-dark: #151821;
      --bg-panel: #0d0f14;
      --grid-line: rgba(255, 255, 255, 0.045);
      --nav-pill-bg: #f4f6fa;
      --navy-active: #1b3168;
      --navy-glow: rgba(56, 114, 255, 0.55);
      --cyan-neon: #00f0ff;
      --magenta-neon: #ff1cf7;
      --coral-main: #f43f5e;
      --orange-cta: #f58a42;
      --btn-green: #1eb93a;
      --btn-red: #eb1c11;
      --font-ui: 'Space Mono', monospace;
      --font-display: 'Shrikhand', cursive;
      --font-label: 'Fredoka', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: var(--font-ui);
      overflow: hidden;
    }

    /* ==========================================================================
       TOP NAVIGATION PILL BAR (GLOBAL OVERLAY)
       ========================================================================== */
    .top-nav-wrapper {
      position: fixed;
      top: 22px;
      right: 28px;
      z-index: 1000;
      background: var(--nav-pill-bg);
      padding: 8px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 240, 255, 0.15);
    }

    .nav-btn {
      font-family: var(--font-ui);
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      padding: 8px 24px;
      border-radius: 10px;
      border: 1.5px solid #2b3a55;
      background: transparent;
      color: #1a2436;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease,
                  background-color 0.25s ease,
                  color 0.25s ease,
                  border-color 0.25s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #2563eb;
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.65), 0 0 24px rgba(37, 99, 235, 0.35);
    }

    .nav-btn.active {
      background-color: var(--navy-active);
      color: #ffffff;
      border-color: var(--navy-active);
      box-shadow: 0 0 16px rgba(27, 49, 104, 0.75), 0 0 26px rgba(0, 240, 255, 0.4);
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    /* ==========================================================================
       VIEW CONTAINERS
       ========================================================================== */
    .view-section {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .view-section.active {
      display: flex;
      opacity: 1;
    }

    /* ==========================================================================
       SECTION 1: HOME VIEW
       ========================================================================== */
    #home-view {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 36px 36px;
      padding: 20px;
      text-align: center;
    }

    .hero-title-container {
      animation: gentleBreathe 3.4s ease-in-out infinite;
      margin-bottom: 10px;
    }

    @keyframes gentleBreathe {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3.4rem, 8.8vw, 7.2rem);
      font-style: italic;
      line-height: 1.08;
      color: #f03e52;
      letter-spacing: 2px;
      /* Layered 3D retro cyan & magenta offset shadow matching 1.jpg */
      text-shadow:
        -4px  4px 0px #00f0ff,
        -7px  7px 0px rgba(0, 240, 255, 0.65),
         5px -4px 0px #ff00ea,
         8px -7px 0px rgba(255, 0, 234, 0.55),
         0px 14px 30px rgba(0, 0, 0, 0.65);
    }

    .hero-subtitle {
      font-family: var(--font-label);
      font-size: clamp(1.15rem, 2.5vw, 1.95rem);
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #151821;
      margin-top: 6px;
      margin-bottom: 42px;
      /* Hollow outlined neon effect matching 1.jpg */
      -webkit-text-stroke: 1.4px #e845d6;
      text-shadow:
        -1.5px  1.5px 0px #00f0ff,
         1.5px -1.5px 0px #ff00ea,
         0px 0px 14px rgba(232, 69, 214, 0.45);
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .orange-play-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: var(--orange-cta);
      border: 4px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 138, 66, 0.45);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .orange-play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 28px rgba(245, 138, 66, 0.85), 0 0 45px rgba(255, 170, 90, 0.4);
    }

    .orange-play-btn:active {
      transform: scale(0.95);
    }

    .play-triangle {
      width: 0;
      height: 0;
      margin-left: 6px;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 26px solid #ffffff;
    }

    .cta-label {
      font-family: var(--font-ui);
      font-size: 1.25rem;
      color: #e6eaf2;
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       SECTION 2: SOUND WAVES SIMULATION VIEW
       ========================================================================== */
    #waves-view {
      flex-direction: column;
      background-color: var(--bg-dark);
      padding-top: 94px;
    }

    /* Dark horizontal control bar from 2.jpg - 7.jpg */
    .sim-control-bar {
      width: 100%;
      background-color: var(--bg-panel);
      border-radius: 16px;
      padding: 14px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .wave-type-group {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .wave-mode-btn {
      font-family: var(--font-ui);
      font-size: 0.95rem;
      padding: 12px 26px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      background: transparent;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .wave-mode-btn:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
      transform: translateY(-2px);
    }

    .wave-mode-btn.active {
      background-color: var(--navy-active);
      border-color: var(--navy-active);
      box-shadow: 0 0 18px rgba(45, 95, 220, 0.6);
    }

    /* 4 Object Cards on Right */
    .object-selector-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .obj-card {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(135deg, #00f0ff 0%, #9b30ff 55%, #ff00e6 100%);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      position: relative;
    }

    .obj-card:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.55);
    }

    .obj-card.active {
      transform: scale(1.07);
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.8), 0 0 28px rgba(255, 0, 230, 0.6);
    }

    .obj-card-inner {
      width: 100%;
      height: 100%;
      background: #465366;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .obj-card.active .obj-card-inner {
      background: #35445c;
    }

    /* Sub-bar for Start / Restart buttons positioned below right cards */
    .sim-action-row {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 16px 64px 0 64px;
      gap: 36px;
      z-index: 20;
    }

    .action-btn {
      font-family: var(--font-ui);
      font-size: 0.92rem;
      font-weight: 400;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 9px 36px;
      min-width: 136px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .btn-start {
      background-color: var(--btn-green);
      box-shadow: 0 4px 15px rgba(30, 185, 58, 0.4);
    }

    .btn-start:hover {
      box-shadow: 0 0 20px rgba(30, 185, 58, 0.75);
    }

    .btn-start.running {
      background-color: #e67e22;
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.45);
    }

    .btn-restart {
      background-color: var(--btn-red);
      box-shadow: 0 4px 15px rgba(235, 28, 17, 0.4);
    }

    .btn-restart:hover {
      box-shadow: 0 0 20px rgba(235, 28, 17, 0.75);
    }

    /* Simulation Interactive Stage */
    .sim-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    #waves-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==========================================================================
       SECTION 3: REAL EXAMPLE FULL-BLEED VIEW
       ========================================================================== */
    #real-view {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #real-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .real-top-controls {
      position: fixed;
      top: 26px;
      left: 36px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .real-btn-row {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .real-legend {
      display: flex;
      align-items: center;
      gap: 24px;
      padding-left: 4px;
      margin-top: 22px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-label);
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
    }

    .legend-swatch {
      width: 22px;
      height: 22px;
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .swatch-yellow {
      background-color: #f6e05e;
    }

    .swatch-red {
      background-color: #ff1a1a;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      .top-nav-wrapper {
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        gap: 8px;
      }
      .nav-btn {
        padding: 6px 12px;
        font-size: 0.78rem;
      }
      #waves-view {
        padding-top: 72px;
      }
      .sim-control-bar {
        padding: 10px 16px;
        justify-content: center;
      }
      .obj-card {
        width: 58px;
        height: 58px;
      }
      .sim-action-row {
        justify-content: center;
        padding: 12px 16px 0 16px;
        gap: 16px;
      }
      .real-top-controls {
        top: 68px;
        left: 16px;
      }
    }
  </style>
</head>
