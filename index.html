  <!-- ========================================================================
       APPLICATION SCRIPT: WEB AUDIO SYNTHESIS + PHYSICS ANIMATION ENGINES
       ======================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ======================================================================
         1. WEB AUDIO API SOUND EFFECTS ENGINE (Zero external audio files)
         ====================================================================== */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.continuousOsc = null;
          this.continuousGain = null;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        stopContinuous() {
          if (this.continuousOsc) {
            try {
              this.continuousOsc.stop();
              this.continuousOsc.disconnect();
            } catch (e) {}
            this.continuousOsc = null;
          }
          if (this.continuousGain) {
            try {
              this.continuousGain.disconnect();
            } catch (e) {}
            this.continuousGain = null;
          }
        }

        // Deep low-frequency sub-bass hum for Infrasonic
        startInfrasonicHum() {
          this.ensureContext();
          this.stopContinuous();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(52, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.18, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          this.continuousOsc = osc;
          this.continuousGain = gain;
        }

        // High-frequency subtle carrier whine for Ultrasonic
        startUltrasonicTone() {
          this.ensureContext();
          this.stopContinuous();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(3600, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.045, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          this.continuousOsc = osc;
          this.continuousGain = gain;
        }

        // Supersonic bullet whoosh + sonic crack
        playSupersonicWhoosh() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          const duration = 0.65;

          // White noise filtered sweep
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(3.2, now);
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(2400, now + 0.22);
          filter.frequency.exponentialRampToValueAtTime(180, now + duration);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.35, now + 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          // Low boom punch
          const boom = this.ctx.createOscillator();
          const boomGain = this.ctx.createGain();
          boom.type = 'triangle';
          boom.frequency.setValueAtTime(140, now + 0.12);
          boom.frequency.exponentialRampToValueAtTime(32, now + 0.55);
          boomGain.gain.setValueAtTime(0.28, now + 0.12);
          boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          boom.connect(boomGain);
          boomGain.connect(this.ctx.destination);
          boom.start(now + 0.12);
          boom.stop(now + 0.56);
        }

        // Crisp glass shatter sound effect
        playGlassShatter() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          // High-frequency noise burst + metallic chime shards
          const duration = 0.75;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.18));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const hp = this.ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.setValueAtTime(1800, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(hp);
          hp.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          // Tinkling shard frequencies
          const freqs = [2850, 3620, 4410, 5190, 3180];
          freqs.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            const t = now + idx * 0.045;
            osc.frequency.setValueAtTime(f, t);
            osc.frequency.exponentialRampToValueAtTime(f * 0.85, t + 0.25);
            g.gain.setValueAtTime(0.09, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.27);
          });
        }

        // Water splash & slosh sound effect
        playWaterSplash() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          const duration = 0.85;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.28));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.Q.setValueAtTime(1.4, now);
          bp.frequency.setValueAtTime(500, now);
          bp.frequency.exponentialRampToValueAtTime(1350, now + 0.22);
          bp.frequency.exponentialRampToValueAtTime(380, now + duration);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(bp);
          bp.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        }

        // Dolphin sonar click train
        playDolphinSonar() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          for (let i = 0; i < 7; i++) {
            const t = now + i * 0.09;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1950 + i * 90, t);
            osc.frequency.exponentialRampToValueAtTime(1100, t + 0.055);
            g.gain.setValueAtTime(0.14, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.065);
          }
        }

        // Bat high-pitched echolocation chirps
        playBatChirp() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          for (let i = 0; i < 6; i++) {
            const t = now + i * 0.1;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(5200, t);
            osc.frequency.exponentialRampToValueAtTime(2900, t + 0.065);
            g.gain.setValueAtTime(0.09, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.075);
          }
        }

        // Quick chomp / catch sound effect when bat & dolphin eat their prey
        playChomp() {
          this.ensureContext();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      }

      const sound = new SoundEngine();

      /* ======================================================================
         2. NAVIGATION CONTROLLER
         ====================================================================== */
      const navButtons = document.querySelectorAll('.nav-btn');
      const sections = document.querySelectorAll('.view-section');

      function switchView(targetId) {
        sound.stopContinuous();
        // Pause running simulations when leaving tabs
        if (targetId !== 'waves-view' && wavesSim.running) {
          wavesSim.toggleStart(false);
        }
        if (targetId !== 'real-view' && realSim.running) {
          realSim.stop();
        }

        navButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.target === targetId);
        });
        sections.forEach((sec) => {
          sec.classList.toggle('active', sec.id === targetId);
        });

        if (targetId === 'waves-view') {
          wavesSim.resize();
          wavesSim.draw();
        } else if (targetId === 'real-view') {
          realSim.resize();
          realSim.draw();
        }
      }

      navButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchView(btn.dataset.target));
      });

      // Home orange button triggers exact same navigation as "Sound Waves" top menu
      document.getElementById('home-start-btn').addEventListener('click', () => {
        switchView('waves-view');
      });

      /* ======================================================================
         3. SECTION 2: SOUND WAVES SIMULATION ENGINE
         ====================================================================== */
      class WavesSimulation {
        constructor() {
          this.canvas = document.getElementById('waves-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.stage = document.getElementById('sim-stage');
          this.startBtn = document.getElementById('sim-start-btn');
          this.restartBtn = document.getElementById('sim-restart-btn');

          this.mode = 'infrasonic'; // 'infrasonic' | 'ultrasonic' | 'supersonic'
          this.objectType = 'apple'; // 'apple' | 'human' | 'water' | 'glass'
          this.running = false;
          this.time = 0;
          this.lastFrame = 0;
          this.rafId = null;

          // Dynamic physics state
          this.resetPhysicsState();
          this.bindEvents();
          this.resize();
        }

        resetPhysicsState() {
          this.time = 0;
          this.waveFrontX = 0;
          this.impactEnergy = 0; // 0 to 1 thermal/vibration buildup
          this.humanStandProgress = 0; // 0 (sitting) to 1 (standing/jumping)

          // Apple supersonic state
          this.appleXOffset = 0;
          this.appleYOffset = 0;
          this.appleAngle = 0;
          this.appleVx = 0;
          this.appleVy = 0;
          this.appleAngularVel = 0;
          this.appleToppled = false;

          // Human supersonic state
          this.humanXOffset = 0;
          this.humanAngle = 0;
          this.humanVx = 0;
          this.humanAngularVel = 0;

          // Supersonic bullets state
          this.bulletsLaunched = false;
          this.bulletYOffset = 90; // hidden below bottom edge initially
          this.bulletTriggeredImpact = false;
          this.motionLinesAlpha = 0;

          // Water state
          this.waterSlosh = 0;
          this.waterSloshVel = 0;
          this.waterDroplets = [];

          // Glass shatter state
          this.glassShattered = false;
          this.glassShards = [];
        }

        bindEvents() {
          window.addEventListener('resize', () => {
            if (document.getElementById('waves-view').classList.contains('active')) {
              this.resize();
              this.draw();
            }
          });

          // Mode buttons
          document.querySelectorAll('.wave-mode-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.wave-mode-btn').forEach((b) => b.classList.remove('active'));
              btn.classList.add('active');
              this.mode = btn.dataset.mode;
              this.restart();
            });
          });

          // Object cards
          document.querySelectorAll('.obj-card').forEach((card) => {
            card.addEventListener('click', () => {
              document.querySelectorAll('.obj-card').forEach((c) => c.classList.remove('active'));
              card.classList.add('active');
              this.objectType = card.dataset.obj;
              this.restart();
            });
          });

          // Start / Stop button
          this.startBtn.addEventListener('click', () => {
            this.toggleStart(!this.running);
          });

          // Restart button
          this.restartBtn.addEventListener('click', () => {
            this.restart();
          });
        }

        resize() {
          const rect = this.stage.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          this.width = Math.max(320, rect.width);
          this.height = Math.max(280, rect.height);
          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        toggleStart(shouldRun) {
          this.running = shouldRun;
          if (this.running) {
            this.startBtn.textContent = 'Stop';
            this.startBtn.classList.add('running');
            this.lastFrame = performance.now();

            if (this.mode === 'infrasonic') {
              sound.startInfrasonicHum();
            } else if (this.mode === 'ultrasonic') {
              sound.startUltrasonicTone();
            } else if (this.mode === 'supersonic') {
              if (!this.bulletsLaunched) {
                this.bulletsLaunched = true;
                sound.playSupersonicWhoosh();
              }
            }

            const loop = (now) => {
              if (!this.running) return;
              const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
              this.lastFrame = now;
              this.update(dt);
              this.draw();
              this.rafId = requestAnimationFrame(loop);
            };
            this.rafId = requestAnimationFrame(loop);
          } else {
            this.startBtn.textContent = 'Start';
            this.startBtn.classList.remove('running');
            sound.stopContinuous();
            if (this.rafId) cancelAnimationFrame(this.rafId);
            this.draw();
          }
        }

        restart() {
          this.toggleStart(false);
          this.resetPhysicsState();
          this.draw();
        }

        update(dt) {
          this.time += dt;
          const speakerX = this.width * 0.14;
          const targetBaseX = this.width * 0.76;

          if (this.mode === 'infrasonic' || this.mode === 'ultrasonic') {
            const speed = this.mode === 'infrasonic' ? 290 : 380;
            this.waveFrontX = Math.min(this.width + 80, this.waveFrontX + speed * dt);

            const reachedTarget = speakerX + this.waveFrontX >= targetBaseX - 75;
            if (reachedTarget) {
              this.impactEnergy = Math.min(1, this.impactEnergy + dt * 1.3);
              if (this.mode === 'ultrasonic' && this.objectType === 'human') {
                this.humanStandProgress = Math.min(1, this.humanStandProgress + dt * 3.8);
              }
            }
          } else if (this.mode === 'supersonic') {
            // Bullets travel upward fast enough to clearly see with shockwave trails
            const bulletSpeed = this.height * 1.15;
            this.bulletYOffset -= bulletSpeed * dt;

            const currentBulletY = this.height + this.bulletYOffset;
            const impactZoneY = this.height * 0.56;

            if (currentBulletY <= impactZoneY && !this.bulletTriggeredImpact) {
              this.bulletTriggeredImpact = true;
              this.motionLinesAlpha = 1.0;

              if (this.objectType === 'apple') {
                this.appleVx = 260;
                this.appleVy = -140;
                this.appleAngularVel = 4.6;
              } else if (this.objectType === 'human') {
                this.humanVx = 210;
                this.humanAngularVel = 1.65;
              } else if (this.objectType === 'water') {
                sound.playWaterSplash();
                this.waterSloshVel = 18;
                // Spawn water droplets splashing to the right
                for (let i = 0; i < 24; i++) {
                  this.waterDroplets.push({
                    x: targetBaseX - 40 + Math.random() * 80,
                    y: this.height * 0.58 + Math.random() * 20,
                    vx: 90 + Math.random() * 240,
                    vy: -140 - Math.random() * 210,
                    r: 3 + Math.random() * 4.5
                  });
                }
              } else if (this.objectType === 'glass' && !this.glassShattered) {
                this.glassShattered = true;
                sound.playGlassShatter();
                this.createGlassShards(targetBaseX, this.height * 0.55);
              }
            }

            // Update Apple topple & slide physics
            if (this.bulletTriggeredImpact && this.objectType === 'apple') {
              const floorY = 65;
              this.appleXOffset += this.appleVx * dt;
              this.appleVx *= Math.pow(0.22, dt);

              if (!this.appleToppled || this.appleYOffset < floorY) {
                this.appleVy += 680 * dt; // gravity
                this.appleYOffset += this.appleVy * dt;
                this.appleAngle += this.appleAngularVel * dt;

                if (this.appleYOffset >= floorY) {
                  this.appleYOffset = floorY;
                  if (Math.abs(this.appleVy) > 55) {
                    this.appleVy = -this.appleVy * 0.35;
                    this.appleAngularVel *= 0.45;
                  } else {
                    this.appleVy = 0;
                    this.appleAngularVel = 0;
                    this.appleToppled = true;
                  }
                }
              }
              this.motionLinesAlpha = Math.max(0, this.motionLinesAlpha - dt * 0.7);
            }

            // Update Human push & near-topple while seated
            if (this.bulletTriggeredImpact && this.objectType === 'human') {
              this.humanXOffset += this.humanVx * dt;
              this.humanVx *= Math.pow(0.14, dt);

              this.humanAngle += this.humanAngularVel * dt;
              // Almost topples (~42 deg) then wobbles back slightly to ~34 deg
              if (this.humanAngle > 0.74) {
                this.humanAngle = 0.74;
                this.humanAngularVel = -0.35;
              } else if (this.humanAngularVel < 0 && this.humanAngle <= 0.58) {
                this.humanAngle = 0.58;
                this.humanAngularVel = 0;
              }
            }
          }

          // Update Water slosh & droplets
          if (this.objectType === 'water') {
            this.waterSlosh += this.waterSloshVel * dt;
            this.waterSloshVel += (-18 * this.waterSlosh - 2.6 * this.waterSloshVel) * dt;

            for (let i = this.waterDroplets.length - 1; i >= 0; i--) {
              const d = this.waterDroplets[i];
              d.vy += 540 * dt;
              d.x += d.vx * dt;
              d.y += d.vy * dt;
              if (d.y > this.height * 0.85) {
                this.waterDroplets.splice(i, 1);
              }
            }
          }

          // Update Glass falling shards
          if (this.objectType === 'glass' && this.glassShattered) {
            const groundY = this.height * 0.84;
            for (const s of this.glassShards) {
              if (!s.settled) {
                s.vy += 640 * dt;
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.rot += s.vRot * dt;
                if (s.y >= groundY) {
                  s.y = groundY;
                  if (Math.abs(s.vy) > 65) {
                    s.vy = -s.vy * 0.25;
                    s.vx *= 0.45;
                    s.vRot *= 0.4;
                  } else {
                    s.vy = 0;
                    s.vx = 0;
                    s.vRot = 0;
                    s.settled = true;
                  }
                }
              }
            }
          }
        }

        createGlassShards(cx, cy) {
          this.glassShards = [];
          const count = 16;
          for (let i = 0; i < count; i++) {
            const col = i % 3;
            const row = Math.floor(i / 3);
            this.glassShards.push({
              x: cx - 35 + col * 32 + (Math.random() - 0.5) * 14,
              y: cy - 85 + row * 34 + (Math.random() - 0.5) * 12,
              vx: 40 + Math.random() * 190,
              vy: -90 + (Math.random() - 0.4) * 160,
              rot: Math.random() * Math.PI,
              vRot: (Math.random() - 0.5) * 10,
              size: 14 + Math.random() * 18,
              settled: false
            });
          }
        }

        draw() {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, this.width, this.height);

          const speakerX = this.width * 0.13;
          const speakerY = this.height * 0.58;
          const targetX = this.width * 0.76;
          const targetY = this.height * 0.58;

          // 1. Draw Speaker (only for Infrasonic & Ultrasonic)
          if (this.mode !== 'supersonic') {
            this.drawSpeaker(ctx, speakerX, speakerY);
          }

          // 2. Draw Sound Waves (for Infrasonic & Ultrasonic when active or mid-progress)
          if (this.mode !== 'supersonic' && (this.running || this.waveFrontX > 0)) {
            this.drawAcousticWaves(ctx, speakerX + 58, speakerY - 75, targetX);
          }

          // 3. Draw Supersonic Bullets & Trails (when in Supersonic mode)
          if (this.mode === 'supersonic') {
            this.drawSupersonicBullets(ctx, targetX - 185, targetY);
          }

          // 4. Draw Selected Target Object & Reaction
          if (this.objectType === 'apple') {
            this.drawApple(ctx, targetX, targetY);
          } else if (this.objectType === 'human') {
            this.drawHuman(ctx, targetX, targetY);
          } else if (this.objectType === 'water') {
            this.drawWater(ctx, targetX, targetY);
          } else if (this.objectType === 'glass') {
            this.drawGlass(ctx, targetX, targetY);
          }
        }

        /* --------------------------------------------------------------------
           DRAW: BLUE DUAL-DRIVER TOWER SPEAKER (Matches 2.jpg - 5.jpg)
           -------------------------------------------------------------------- */
        drawSpeaker(ctx, cx, cy) {
          ctx.save();
          // Vibrate speaker cabinet & cones when active
          let vibX = 0;
          let vibY = 0;
          let conePulse = 0;
          if (this.running) {
            if (this.mode === 'infrasonic') {
              vibX = Math.sin(this.time * 42) * 3.8;
              vibY = Math.cos(this.time * 36) * 1.5;
              conePulse = Math.sin(this.time * 32) * 3.5;
            } else if (this.mode === 'ultrasonic') {
              vibX = Math.sin(this.time * 125) * 2.2;
              vibY = Math.cos(this.time * 115) * 1.4;
              conePulse = Math.sin(this.time * 95) * 2.2;
            }
          }

          ctx.translate(cx + vibX, cy + vibY);
          const scale = Math.min(1.05, Math.max(0.75, this.height / 470));
          ctx.scale(scale, scale);

          // Rear kickstand
          ctx.strokeStyle = '#6ec8f5';
          ctx.lineWidth = 6;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(-48, -110);
          ctx.lineTo(-76, 128);
          ctx.lineTo(-35, 128);
          ctx.stroke();

          ctx.strokeStyle = '#1f2838';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // Left 3D side panel
          ctx.fillStyle = '#4e6496';
          ctx.strokeStyle = '#1d2432';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-58, -126);
          ctx.lineTo(-34, -135);
          ctx.lineTo(-22, 136);
          ctx.lineTo(-46, 134);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Front blue speaker cabinet
          ctx.fillStyle = '#4682f0';
          ctx.beginPath();
          ctx.moveTo(-34, -135);
          ctx.lineTo(36, -132);
          ctx.quadraticCurveTo(46, -131, 47, -120);
          ctx.lineTo(59, 124);
          ctx.quadraticCurveTo(59, 135, 47, 136);
          ctx.lineTo(-22, 136);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Top Woofer Cone
          this.drawSpeakerCone(ctx, 8, -74, 34 + conePulse);
          // Bottom Woofer Cone
          this.drawSpeakerCone(ctx, 13, 18, 32 + conePulse * 0.85);

          // Bottom Volume Knob
          ctx.fillStyle = '#89d4f5';
          ctx.strokeStyle = '#1d2432';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(19, 92, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#3c6fd1';
          ctx.beginPath();
          ctx.arc(22, 92, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.restore();
        }

        drawSpeakerCone(ctx, x, y, radius) {
          ctx.save();
          ctx.translate(x, y);
          // Outer cyan ring
          ctx.fillStyle = '#7dd3fc';
          ctx.strokeStyle = '#1d2432';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, radius * 0.92, radius, -0.06, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Dark cone interior
          ctx.fillStyle = '#333b48';
          ctx.beginPath();
          ctx.ellipse(2, 0, radius * 0.68, radius * 0.75, -0.06, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Mesh grille pattern
          ctx.fillStyle = '#64748b';
          for (let gx = -10; gx <= 12; gx += 6) {
            for (let gy = -12; gy <= 12; gy += 6) {
              if (gx * gx + gy * gy < (radius * 0.45) ** 2) {
                ctx.beginPath();
                ctx.arc(gx + 2, gy, 1.5, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          ctx.restore();
        }

        /* --------------------------------------------------------------------
           DRAW: INFRASONIC (Low f, Long) & ULTRASONIC (High f, Dense) WAVES
           -------------------------------------------------------------------- */
        drawAcousticWaves(ctx, startX, startY, targetX) {
          ctx.save();
          const isInfra = this.mode === 'infrasonic';

          // Multiple parallel wave lines as requested
          const lineCount = isInfra ? 4 : 6;
          const spacing = isInfra ? 28 : 19;
          const wavelength = isInfra ? 145 : 44;
          const amplitude = isInfra ? 13 : 8.5;
          const phaseSpeed = isInfra ? 7.5 : 18;

          const maxReachX = Math.min(this.width, startX + this.waveFrontX);

          for (let i = 0; i < lineCount; i++) {
            const yOffset = (i - (lineCount - 1) / 2) * spacing;
            const baseY = startY + 25 + yOffset;

            ctx.beginPath();
            ctx.lineWidth = isInfra ? 2.8 : 2.1;
            const alpha = 1 - Math.abs(i - (lineCount - 1) / 2) * 0.14;
            ctx.strokeStyle = isInfra
              ? `rgba(255, 255, 255, ${alpha})`
              : `rgba(185, 246, 255, ${alpha})`;

            for (let x = startX; x <= maxReachX; x += 3) {
              const dist = x - startX;
              // Taper amplitude slightly at start
              const env = Math.min(1, dist / 35);
              const k = (Math.PI * 2) / wavelength;
              const y = baseY + Math.sin(dist * k - this.time * phaseSpeed + i * 0.5) * amplitude * env;

              if (x === startX) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            }
            ctx.stroke();
          }
          ctx.restore();
        }

        /* --------------------------------------------------------------------
           DRAW: SUPERSONIC BULLETS & SHOCKWAVE TRAILS (Matches 6.jpg & 7.jpg)
           -------------------------------------------------------------------- */
        drawSupersonicBullets(ctx, leftOfTargetX, targetY) {
          const bulletBaseY = this.height + this.bulletYOffset;
          // Only draw once launched or peeking from bottom
          if (!this.bulletsLaunched && bulletBaseY > this.height + 40) return;

          const bulletPositions = [leftOfTargetX - 75, leftOfTargetX + 55];

          bulletPositions.forEach((bx) => {
            ctx.save();
            ctx.translate(bx, bulletBaseY);

            // Shockwave / Mach cone smoke trails behind bullet (matching 7.jpg)
            if (this.bulletsLaunched) {
              ctx.strokeStyle = 'rgba(130, 138, 150, 0.35)';
              ctx.lineWidth = 4;
              ctx.lineCap = 'round';

              // Curved shock arcs behind bullet
              for (let a = 1; a <= 3; a++) {
                ctx.beginPath();
                ctx.arc(0, 26 + a * 18, 22 + a * 12, 0.22 * Math.PI, 0.78 * Math.PI);
                ctx.stroke();
              }

              // Vertical speed/exhaust streaks
              ctx.strokeStyle = 'rgba(120, 128, 140, 0.28)';
              ctx.lineWidth = 3.5;
              const streakOffsets = [-34, -18, 0, 18, 34];
              streakOffsets.forEach((sx, idx) => {
                ctx.beginPath();
                ctx.moveTo(sx, 85 + (idx % 2) * 12);
                ctx.lineTo(sx * 1.25, 145 + (idx % 2) * 14);
                ctx.stroke();
              });

              // Dark smoke cone directly under bullet casing
              ctx.fillStyle = 'rgba(85, 92, 102, 0.55)';
              ctx.beginPath();
              ctx.moveTo(-12, 14);
              ctx.lineTo(12, 14);
              ctx.lineTo(26, 56);
              ctx.quadraticCurveTo(0, 64, -26, 56);
              ctx.closePath();
              ctx.fill();
            }

            // Metallic Silver Bullet Body (matching 6.jpg & 7.jpg)
            ctx.fillStyle = '#b8c0cc';
            ctx.strokeStyle = '#333b48';
            ctx.lineWidth = 2;

            // Casing cylinder
            ctx.beginPath();
            ctx.rect(-10, -14, 20, 32);
            ctx.fill();
            ctx.stroke();

            // Specular highlight strip on bullet
            ctx.fillStyle = '#eef2f7';
            ctx.fillRect(-5, -14, 5, 32);

            // Rounded nose cone
            ctx.fillStyle = '#cfd6e0';
            ctx.beginPath();
            ctx.arc(0, -14, 10, Math.PI, 0);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-3, -17, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          });
        }

        /* --------------------------------------------------------------------
           DRAW TARGET 1: APPLE (Matches 6.jpg & 7.jpg + Ultrasonic Thermal Glow)
           -------------------------------------------------------------------- */
        drawApple(ctx, cx, cy) {
          ctx.save();
          const drawX = cx + this.appleXOffset;
          const drawY = cy + this.appleYOffset;

          // Supersonic wind/push lines to the left of the apple (matching 7.jpg)
          if (this.mode === 'supersonic' && this.motionLinesAlpha > 0.02) {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.motionLinesAlpha * 0.85})`;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            const lineYs = [-52, -16, 20, 56];
            const lineLens = [56, 44, 52, 74];
            lineYs.forEach((ly, idx) => {
              ctx.beginPath();
              ctx.moveTo(drawX - 135, drawY + ly);
              ctx.lineTo(drawX - 135 + lineLens[idx], drawY + ly);
              ctx.stroke();
            });
            ctx.restore();
          }

          ctx.translate(drawX, drawY);
          ctx.rotate(this.appleAngle);

          // Apple silhouette (crisp detailed red bitten apple)
          const s = 1.15;
          ctx.scale(s, s);

          // Stem
          ctx.fillStyle = '#facc15';
          ctx.strokeStyle = '#111827';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-4, -76, 8, 18, 3);
          ctx.fill();
          ctx.stroke();

          // Red Apple Body with Bite on right
          ctx.fillStyle = '#ef1a1a';
          ctx.strokeStyle = '#0f131a';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, -56);
          ctx.bezierCurveTo(-34, -72, -68, -42, -62, 6);
          ctx.bezierCurveTo(-56, 52, -24, 68, 0, 62);
          ctx.bezierCurveTo(22, 68, 46, 56, 54, 34);
          // Bite cutout
          ctx.bezierCurveTo(32, 26, 32, -8, 56, -16);
          ctx.bezierCurveTo(50, -48, 26, -68, 0, -56);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cream inner bite flesh
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.moveTo(54, 34);
          ctx.bezierCurveTo(32, 26, 32, -8, 56, -16);
          ctx.bezierCurveTo(44, -4, 44, 22, 54, 34);
          ctx.fill();

          // Pixel/retro shine highlights on upper-left
          ctx.fillStyle = '#fde047';
          ctx.fillRect(-44, -34, 5, 5);
          ctx.fillRect(-37, -40, 5, 5);

          // Ultrasonic thermal heat glow on left impact side
          if (this.mode === 'ultrasonic' && this.impactEnergy > 0.05) {
            const pulse = 0.85 + Math.sin(this.time * 16) * 0.15;
            const grad = ctx.createRadialGradient(-48, -8, 4, -48, -8, 48 * pulse);
            grad.addColorStop(0, `rgba(255, 240, 150, ${0.95 * this.impactEnergy})`);
            grad.addColorStop(0.4, `rgba(255, 110, 20, ${0.75 * this.impactEnergy})`);
            grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(-48, -8, 50, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           DRAW TARGET 2: HUMAN (Matches 2.jpg sitting & 3.jpg/4.jpg standing + bones)
           -------------------------------------------------------------------- */
        drawHuman(ctx, cx, cy) {
          ctx.save();
          ctx.translate(cx + this.humanXOffset, cy + 15);
          ctx.rotate(this.humanAngle);

          const isStanding = this.mode === 'ultrasonic' && this.humanStandProgress > 0.35;

          if (!isStanding) {
            // SEATED POSE (Matches 2.jpg)
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#7c828d';
            ctx.lineWidth = 4.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Head
            ctx.beginPath();
            ctx.arc(-6, -68, 36, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Torso & back
            ctx.beginPath();
            ctx.moveTo(-24, -34);
            ctx.quadraticCurveTo(22, -42, 34, -12);
            ctx.quadraticCurveTo(48, 36, 36, 78);
            ctx.quadraticCurveTo(26, 94, -12, 92);
            ctx.lineTo(-42, 90);
            ctx.lineTo(-34, 24);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Bent Knee & Leg
            ctx.beginPath();
            ctx.moveTo(-16, 12);
            ctx.lineTo(-44, 12);
            ctx.lineTo(-56, 74);
            ctx.lineTo(-68, 78);
            ctx.quadraticCurveTo(-72, 90, -56, 90);
            ctx.lineTo(-32, 90);
            ctx.lineTo(-22, 42);
            ctx.stroke();

            // Arm hugging knees
            ctx.beginPath();
            ctx.moveTo(-4, -16);
            ctx.lineTo(-56, -14);
            ctx.quadraticCurveTo(-68, -6, -56, 4);
            ctx.lineTo(-14, 4);
            ctx.fill();
            ctx.stroke();
          } else {
            // STANDING / JUMPING POSE WITH ARMS & LEGS SPREAD (Matches 3.jpg & 4.jpg)
            const p = this.humanStandProgress;
            ctx.scale(0.85 + 0.15 * p, 0.85 + 0.15 * p);

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#7c828d';
            ctx.lineWidth = 5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Full jumping body silhouette
            ctx.beginPath();
            // Left raised arm
            ctx.moveTo(-26, -34);
            ctx.lineTo(-58, -94);
            ctx.quadraticCurveTo(-66, -104, -76, -92);
            ctx.lineTo(-44, -14);
            // Left spread leg
            ctx.lineTo(-44, 58);
            ctx.lineTo(-96, 82);
            ctx.quadraticCurveTo(-104, 92, -88, 98);
            ctx.lineTo(-24, 78);
            // Crotch to right spread leg
            ctx.lineTo(0, 72);
            ctx.lineTo(68, 98);
            ctx.quadraticCurveTo(84, 92, 76, 82);
            ctx.lineTo(26, 58);
            // Right raised arm
            ctx.lineTo(26, -14);
            ctx.lineTo(58, -92);
            ctx.quadraticCurveTo(48, -104, 40, -94);
            ctx.lineTo(10, -34);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(-8, -54, 34, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Faintly visible Skull & Bones inside body (matching 3.jpg & 4.jpg)
            const boneAlpha = Math.min(0.85, this.impactEnergy * 0.9);
            ctx.save();
            ctx.globalAlpha = boneAlpha;

            // Skull inside head
            ctx.fillStyle = '#9ca3af';
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-8, -58, 20, Math.PI * 0.85, Math.PI * 2.15);
            ctx.lineTo(6, -36);
            ctx.lineTo(-22, -36);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Eye sockets
            ctx.fillStyle = '#1f2937';
            ctx.beginPath();
            ctx.arc(-15, -56, 4.5, 0, Math.PI * 2);
            ctx.arc(-1, -56, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Nasal cavity & teeth
            ctx.beginPath();
            ctx.moveTo(-8, -50);
            ctx.lineTo(-10, -45);
            ctx.lineTo(-6, -45);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#e5e7eb';
            ctx.fillRect(-16, -42, 16, 6);
            ctx.strokeRect(-16, -42, 16, 6);

            // Faint Ribcage & Spine inside torso
            ctx.strokeStyle = 'rgba(75, 85, 99, 0.55)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-8, -26);
            ctx.lineTo(-8, 46);
            ctx.stroke();

            for (let r = 0; r < 4; r++) {
              const ry = -16 + r * 12;
              ctx.beginPath();
              ctx.ellipse(-8, ry, 18 - r * 1.5, 4, 0, 0, Math.PI);
              ctx.stroke();
            }

            // Faint Arm & Leg Bones
            ctx.beginPath();
            ctx.moveTo(-26, -24);
            ctx.lineTo(-60, -86);
            ctx.moveTo(10, -24);
            ctx.lineTo(44, -86);
            ctx.moveTo(-18, 56);
            ctx.lineTo(-82, 86);
            ctx.moveTo(6, 56);
            ctx.lineTo(66, 86);
            ctx.stroke();

            ctx.restore();

            // Glowing orange impact point where ultrasonic wave hits left arm (matching 3.jpg)
            if (this.impactEnergy > 0.1) {
              const glow = ctx.createRadialGradient(-64, -84, 2, -64, -84, 26);
              glow.addColorStop(0, 'rgba(255, 250, 200, 0.95)');
              glow.addColorStop(0.45, 'rgba(255, 115, 35, 0.85)');
              glow.addColorStop(1, 'rgba(255, 80, 0, 0)');
              ctx.fillStyle = glow;
              ctx.beginPath();
              ctx.arc(-64, -84, 26, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           DRAW TARGET 3: WATER IN WIDE TRANSPARENT CONTAINER / POND
           -------------------------------------------------------------------- */
        drawWater(ctx, cx, cy) {
          ctx.save();
          let shakeX = 0;
          if (this.running && this.impactEnergy > 0.05) {
            if (this.mode === 'infrasonic') {
              shakeX = Math.sin(this.time * 38) * 2.5;
            } else if (this.mode === 'ultrasonic') {
              shakeX = Math.sin(this.time * 95) * 3.5;
            }
          }

          ctx.translate(cx + shakeX, cy + 25);

          const tankW = 210;
          const tankH = 125;
          const halfW = tankW / 2;

          // Back glass wall
          ctx.fillStyle = 'rgba(186, 230, 253, 0.12)';
          ctx.strokeStyle = 'rgba(147, 197, 253, 0.65)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-halfW, -tankH / 2, tankW, tankH, [4, 4, 16, 16]);
          ctx.fill();
          ctx.stroke();

          // Water body with dynamic wave surface & slosh
          const waterTop = -14;
          const sloshTilt = this.waterSlosh * 1.8;

          // Color shifts slightly warmer when heated by Ultrasonic
          const heat = this.mode === 'ultrasonic' ? this.impactEnergy : 0;
          const waterGrad = ctx.createLinearGradient(0, waterTop, 0, tankH / 2);
          if (heat > 0.1) {
            waterGrad.addColorStop(0, `rgba(${Math.round(56 + heat * 195)}, ${Math.round(189 - heat * 75)}, ${Math.round(248 - heat * 180)}, 0.82)`);
            waterGrad.addColorStop(1, `rgba(${Math.round(29 + heat * 180)}, ${Math.round(78 - heat * 30)}, ${Math.round(216 - heat * 160)}, 0.9)`);
          } else {
            waterGrad.addColorStop(0, 'rgba(56, 189, 248, 0.78)');
            waterGrad.addColorStop(1, 'rgba(29, 78, 216, 0.88)');
          }

          ctx.fillStyle = waterGrad;
          ctx.beginPath();
          ctx.moveTo(-halfW + 3, tankH / 2 - 4);

          const rippleAmp = this.running
            ? (this.mode === 'infrasonic' ? 4.5 : this.mode === 'ultrasonic' ? 7.5 : 3)
            : Math.abs(this.waterSlosh) * 1.4;
          const rippleFreq = this.mode === 'ultrasonic' ? 0.16 : 0.06;
          const rippleSpeed = this.mode === 'ultrasonic' ? 24 : 10;

          for (let wx = -halfW + 3; wx <= halfW - 3; wx += 4) {
            const normX = wx / halfW; // -1 to 1
            const sloshOffset = normX * sloshTilt;
            const ripple = Math.sin(wx * rippleFreq - this.time * rippleSpeed) * rippleAmp;
            const wy = waterTop + sloshOffset + ripple;
            ctx.lineTo(wx, wy);
          }

          ctx.lineTo(halfW - 3, tankH / 2 - 4);
          ctx.closePath();
          ctx.fill();

          // Ultrasonic thermal glow spot on left side of water
          if (heat > 0.1) {
            const hGrad = ctx.createRadialGradient(-halfW + 25, waterTop + 20, 4, -halfW + 25, waterTop + 20, 55);
            hGrad.addColorStop(0, `rgba(255, 220, 120, ${0.75 * heat})`);
            hGrad.addColorStop(0.5, `rgba(255, 90, 20, ${0.5 * heat})`);
            hGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = hGrad;
            ctx.beginPath();
            ctx.arc(-halfW + 25, waterTop + 20, 55, 0, Math.PI * 2);
            ctx.fill();
          }

          // Front glass rim highlight
          ctx.strokeStyle = 'rgba(224, 242, 254, 0.85)';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(-halfW, -tankH / 2);
          ctx.lineTo(-halfW, tankH / 2 - 12);
          ctx.quadraticCurveTo(-halfW, tankH / 2, -halfW + 12, tankH / 2);
          ctx.lineTo(halfW - 12, tankH / 2);
          ctx.quadraticCurveTo(halfW, tankH / 2, halfW, tankH / 2 - 12);
          ctx.lineTo(halfW, -tankH / 2);
          ctx.stroke();

          ctx.restore();

          // Draw splashing water droplets (Supersonic)
          if (this.waterDroplets.length > 0) {
            ctx.save();
            ctx.fillStyle = '#7dd3fc';
            for (const d of this.waterDroplets) {
              ctx.beginPath();
              ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        /* --------------------------------------------------------------------
           DRAW TARGET 4: GLASS PANE + SUPERSONIC SHATTER (Matches 5.jpg)
           -------------------------------------------------------------------- */
        drawGlass(ctx, cx, cy) {
          ctx.save();

          if (!this.glassShattered) {
            let vibX = 0;
            let vibRot = 0;
            if (this.running && this.impactEnergy > 0.05) {
              if (this.mode === 'infrasonic') {
                vibX = Math.sin(this.time * 40) * 3;
                vibRot = Math.sin(this.time * 40) * 0.025;
              } else if (this.mode === 'ultrasonic') {
                vibX = Math.sin(this.time * 110) * 4.5;
                vibRot = Math.sin(this.time * 110) * 0.04;
              }
            }

            ctx.translate(cx + vibX, cy - 5);
            ctx.rotate(vibRot);

            // Translucent cyan-blue angled glass pane matching 5.jpg
            ctx.fillStyle = 'rgba(182, 232, 252, 0.88)';
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 3.5;
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(-45, -80);
            ctx.lineTo(48, -108);
            ctx.lineTo(48, 78);
            ctx.lineTo(-45, 106);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Diagonal glossy glass reflections
            ctx.fillStyle = 'rgba(255, 255, 255, 0.48)';
            ctx.beginPath();
            ctx.moveTo(-36, -70);
            ctx.lineTo(14, -85);
            ctx.lineTo(-36, 48);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(22, -88);
            ctx.lineTo(38, -93);
            ctx.lineTo(-18, 86);
            ctx.lineTo(-34, 91);
            ctx.closePath();
            ctx.fill();

            // Ultrasonic thermal impact glow
            if (this.mode === 'ultrasonic' && this.impactEnergy > 0.1) {
              const g = ctx.createRadialGradient(-38, -10, 4, -38, -10, 42);
              g.addColorStop(0, `rgba(255, 240, 180, ${0.85 * this.impactEnergy})`);
              g.addColorStop(0.5, `rgba(255, 120, 40, ${0.55 * this.impactEnergy})`);
              g.addColorStop(1, 'rgba(255, 80, 0, 0)');
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(-38, -10, 42, 0, Math.PI * 2);
              ctx.fill();
            }
          } else {
            // Draw falling jagged glass shards (Matches 5.jpg)
            for (const s of this.glassShards) {
              ctx.save();
              ctx.translate(s.x, s.y);
              ctx.rotate(s.rot);
              ctx.fillStyle = 'rgba(186, 234, 255, 0.9)';
              ctx.strokeStyle = '#3b82f6';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(-s.size * 0.6, -s.size * 0.5);
              ctx.lineTo(s.size * 0.7, -s.size * 0.2);
              ctx.lineTo(s.size * 0.2, s.size * 0.7);
              ctx.lineTo(-s.size * 0.5, s.size * 0.4);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              // Specular glint on shard
              ctx.fillStyle = 'rgba(255,255,255,0.6)';
              ctx.beginPath();
              ctx.moveTo(-s.size * 0.3, -s.size * 0.3);
              ctx.lineTo(s.size * 0.2, -s.size * 0.15);
              ctx.lineTo(-s.size * 0.1, s.size * 0.2);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            }
          }

          ctx.restore();
        }
      }

      /* ======================================================================
         4. SECTION 3: REAL EXAMPLE SIMULATION ENGINE (Matches 8.jpg)
         ====================================================================== */
      class RealExampleSimulation {
        constructor() {
          this.canvas = document.getElementById('real-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.startBtn = document.getElementById('real-start-btn');
          this.restartBtn = document.getElementById('real-restart-btn');

          this.running = false;
          this.completed = false;
          this.elapsed = 0;
          this.lastFrame = 0;
          this.rafId = null;

          this.resetState();
          this.bindEvents();
          this.resize();
        }

        resetState() {
          this.running = false;
          this.completed = false;
          this.elapsed = 0;
          this.dolphinSonarPlayed = false;
          this.batSonarPlayed = false;
          this.dolphinChompPlayed = false;
          this.batChompPlayed = false;

          // Normalized coordinates (0..1 of viewport width, relative to each half height)
          this.bat = { x: 1.18, y: 0.44, wingPhase: 0, dodgeY: 0, mouthOpen: 0 };
          this.fly = { x: -0.14, y: 0.56, wingPhase: 0, eaten: false };

          this.dolphin = { x: 1.22, y: 0.54, finPhase: 0, dodgeY: 0, mouthOpen: 0 };
          this.fish = { x: -0.16, y: 0.52, finPhase: 0, eaten: false };

          this.chompBursts = [];
          this.dolphinWaveProgress = 0; // 0..2 (0..1 outgoing yellow, 1..2 returning red)
          this.batWaveProgress = 0;
          this.labelsOpacity = 0;
          this.labelTimerStarted = false;
          this.labelStartTime = 0;
        }

        bindEvents() {
          window.addEventListener('resize', () => {
            if (document.getElementById('real-view').classList.contains('active')) {
              this.resize();
              this.draw();
            }
          });

          this.startBtn.addEventListener('click', () => {
            if (this.completed || this.running) return;
            this.start();
          });

          this.restartBtn.addEventListener('click', () => {
            this.stop();
            this.resetState();
            this.draw();
          });
        }

        resize() {
          const dpr = window.devicePixelRatio || 1;
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        start() {
          if (this.running || this.completed) return;
          this.running = true;
          this.lastFrame = performance.now();

          const loop = (now) => {
            if (!this.running) return;
            const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
            this.lastFrame = now;
            this.update(dt);
            this.draw();
            this.rafId = requestAnimationFrame(loop);
          };
          this.rafId = requestAnimationFrame(loop);
        }

        stop() {
          this.running = false;
          if (this.rafId) cancelAnimationFrame(this.rafId);
        }

        update(dt) {
          this.elapsed += dt;
          const t = this.elapsed;

          // Continuous wing & fin animations throughout the simulation
          this.bat.wingPhase += dt * 13;
          this.fly.wingPhase += dt * 28;
          this.dolphin.finPhase += dt * 8.5;
          this.fish.finPhase += dt * 12;

          // Phase 1 (0s - 1.8s): Bat & Dolphin enter from the right
          if (t < 1.8) {
            const p = this.easeOutCubic(t / 1.8);
            this.bat.x = 1.18 - p * (1.18 - 0.72);
            this.dolphin.x = 1.22 - p * (1.22 - 0.74);
          }

          // Phase 2 (1.5s - 3.2s): Fly & Fish enter from the left
          if (t >= 1.5 && t < 3.2) {
            const p = this.easeOutCubic((t - 1.5) / 1.7);
            this.fly.x = -0.14 + p * (0.28 - (-0.14));
            this.fish.x = -0.16 + p * (0.26 - (-0.16));
          }

          // Phase 3 (3.2s - 5.2s): Dolphin emits Sonar + Sound Effect + Reflection
          if (t >= 3.2 && t < 5.2) {
            if (!this.dolphinSonarPlayed) {
              this.dolphinSonarPlayed = true;
              sound.playDolphinSonar();
            }
            this.dolphinWaveProgress = Math.min(2, ((t - 3.2) / 1.8) * 2);
          } else if (t >= 5.2 && t < 7.2) {
            this.dolphinWaveProgress = 2;
          }

          // Phase 4 (4.6s - 6.6s): Bat emits Echolocation + High-Pitch Sound + Reflection
          if (t >= 4.6 && t < 6.6) {
            if (!this.batSonarPlayed) {
              this.batSonarPlayed = true;
              sound.playBatChirp();
            }
            this.batWaveProgress = Math.min(2, ((t - 4.6) / 1.8) * 2);
          } else if (t >= 6.6 && t < 7.2) {
            this.batWaveProgress = 2;
          }

          // Phase 5 (4.8s - 8.8s): Labels & pointer rays appear and disappear after 4 seconds
          if (t >= 4.8 && !this.labelTimerStarted) {
            this.labelTimerStarted = true;
            this.labelStartTime = t;
          }
          if (this.labelTimerStarted) {
            const labelAge = t - this.labelStartTime;
            if (labelAge < 0.35) {
              this.labelsOpacity = labelAge / 0.35;
            } else if (labelAge <= 3.65) {
              this.labelsOpacity = 1;
            } else if (labelAge < 4.0) {
              this.labelsOpacity = Math.max(0, 1 - (labelAge - 3.65) / 0.35);
            } else {
              this.labelsOpacity = 0;
            }
          }

          // Phase 6 (7.2s - 10.6s): Prey located -> Bat & Dolphin lunge forward, eat the bug & fish, and exit left
          if (t >= 7.2) {
            const huntP = Math.min(1, (t - 7.2) / 3.4);

            // Prey hovers slightly while awaiting capture before being eaten
            if (!this.fly.eaten) {
              this.fly.x = 0.28 + Math.sin((t - 7.2) * 5) * 0.008;
            }
            if (!this.fish.eaten) {
              this.fish.x = 0.26 + Math.sin((t - 7.2) * 4.5) * 0.008;
            }

            // Stage 6A (0.0 -> 0.42 of huntP): Lunge straight toward prey with open mouth
            if (huntP < 0.42) {
              const lungeP = huntP / 0.42;
              const easeLunge = lungeP * lungeP * (3 - 2 * lungeP);

              // Bat lunges from (0.72, 0.44) to bug at (0.31, 0.56)
              this.bat.x = 0.72 - easeLunge * (0.72 - 0.31);
              this.bat.dodgeY = easeLunge * (0.56 - 0.44);
              this.bat.mouthOpen = Math.sin(lungeP * Math.PI * 0.85);

              // Dolphin lunges from (0.74, 0.54) to fish at (0.31, 0.52)
              this.dolphin.x = 0.74 - easeLunge * (0.74 - 0.31);
              this.dolphin.dodgeY = easeLunge * (0.52 - 0.54);
              this.dolphin.mouthOpen = Math.sin(lungeP * Math.PI * 0.85);
            } else {
              // Stage 6B (0.42 -> 1.0 of huntP): Snap mouth shut, eat prey with burst, and continue off left edge
              const exitP = (huntP - 0.42) / 0.58;
              const smoothExit = exitP * exitP * (3 - 2 * exitP);

              if (!this.fly.eaten) {
                this.fly.eaten = true;
                this.bat.mouthOpen = 0;
                if (!this.batChompPlayed) {
                  this.batChompPlayed = true;
                  sound.playChomp();
                  this.spawnChompBurst(this.fly.x * this.width, this.fly.y * (this.height * 0.5), '#fde047');
                }
              }

              if (!this.fish.eaten) {
                this.fish.eaten = true;
                this.dolphin.mouthOpen = 0;
                if (!this.dolphinChompPlayed) {
                  this.dolphinChompPlayed = true;
                  sound.playChomp();
                  this.spawnChompBurst(this.fish.x * this.width, this.height * 0.5 + this.fish.y * (this.height * 0.5), '#7dd3fc');
                }
              }

              // Continue swimming/flying smoothly off the left edge of the screen
              this.bat.x = 0.31 - smoothExit * 0.56;
              this.bat.dodgeY = (0.56 - 0.44) * (1 - smoothExit * 0.5);

              this.dolphin.x = 0.31 - smoothExit * 0.62;
              this.dolphin.dodgeY = (0.52 - 0.54) * (1 - smoothExit * 0.5);

              if (huntP >= 1) {
                this.completed = true;
                this.stop();
              }
            }
          }

          // Update active chomp burst particles
          for (let i = this.chompBursts.length - 1; i >= 0; i--) {
            const b = this.chompBursts[i];
            b.life -= dt * 2.4;
            b.radius += dt * 75;
            if (b.life <= 0) {
              this.chompBursts.splice(i, 1);
            }
          }
        }

        spawnChompBurst(x, y, color) {
          this.chompBursts.push({ x, y, color, radius: 10, life: 1.0 });
        }

        easeOutCubic(x) {
          return 1 - Math.pow(1 - x, 3);
        }

        draw() {
          const ctx = this.ctx;
          const w = this.width;
          const h = this.height;
          const halfH = h * 0.5;

          ctx.clearRect(0, 0, w, h);

          /* ==================================================================
             UPPER HALF: NIGHT CAVE SKY + MOUNTAIN SILHOUETTES (Matches 8.jpg)
             ================================================================== */
          ctx.fillStyle = '#3d444e';
          ctx.fillRect(0, 0, w, halfH);

          // Dark mountain/cave silhouettes along bottom of upper section
          ctx.fillStyle = '#252930';
          ctx.beginPath();
          ctx.moveTo(0, halfH);
          ctx.lineTo(0, halfH * 0.78);
          ctx.quadraticCurveTo(w * 0.12, halfH * 0.62, w * 0.22, halfH * 0.74);
          ctx.quadraticCurveTo(w * 0.34, halfH * 0.85, w * 0.50, halfH * 0.83);
          ctx.quadraticCurveTo(w * 0.68, halfH * 0.82, w * 0.80, halfH * 0.72);
          ctx.quadraticCurveTo(w * 0.90, halfH * 0.62, w, halfH * 0.68);
          ctx.lineTo(w, halfH);
          ctx.closePath();
          ctx.fill();

          /* ==================================================================
             LOWER HALF: UNDERWATER OCEAN + SEABED & CORAL (Matches 8.jpg)
             ================================================================== */
          ctx.fillStyle = '#6f92a6';
          ctx.fillRect(0, halfH, w, halfH);

          // Underwater seabed silhouette
          ctx.fillStyle = '#536f80';
          ctx.beginPath();
          ctx.moveTo(0, h);
          ctx.lineTo(0, halfH + halfH * 0.74);
          ctx.quadraticCurveTo(w * 0.14, halfH + halfH * 0.86, w * 0.28, halfH + halfH * 0.85);
          ctx.quadraticCurveTo(w * 0.50, halfH + halfH * 0.80, w * 0.72, halfH + halfH * 0.86);
          ctx.quadraticCurveTo(w * 0.88, halfH + halfH * 0.88, w, halfH + halfH * 0.76);
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fill();

          // Left and right coral/kelp silhouettes
          this.drawCoral(ctx, w * 0.08, halfH + halfH * 0.82, 1);
          this.drawCoral(ctx, w * 0.91, halfH + halfH * 0.83, -0.85);

          // Divider horizon line
          ctx.fillStyle = '#1b1f26';
          ctx.fillRect(0, halfH - 2, w, 4);

          /* ==================================================================
             DRAW ANIMALS & ECHOLOCATION WAVES
             ================================================================== */
          const batPxX = this.bat.x * w;
          const batPxY = (this.bat.y + this.bat.dodgeY) * halfH;
          const flyPxX = this.fly.x * w;
          const flyPxY = this.fly.y * halfH;

          const dolphinPxX = this.dolphin.x * w;
          const dolphinPxY = halfH + (this.dolphin.y + this.dolphin.dodgeY) * halfH;
          const fishPxX = this.fish.x * w;
          const fishPxY = halfH + this.fish.y * halfH;

          // Bat Echolocation Waves (Yellow outgoing -> Red returning)
          if (this.batWaveProgress > 0 && this.elapsed < 7.2) {
            this.drawEcholocationArcs(ctx, batPxX - 68, batPxY + 4, flyPxX + 34, this.batWaveProgress);
          }

          // Dolphin Sonar Waves (Yellow outgoing -> Red returning)
          if (this.dolphinWaveProgress > 0 && this.elapsed < 7.2) {
            this.drawEcholocationArcs(ctx, dolphinPxX - 108, dolphinPxY + 6, fishPxX + 44, this.dolphinWaveProgress);
          }

          // Draw Fly & Bat (Upper Half)
          if (!this.fly.eaten) {
            this.drawFly(ctx, flyPxX, flyPxY, this.fly.wingPhase);
          }
          this.drawBat(ctx, batPxX, batPxY, this.bat.wingPhase, this.bat.mouthOpen);

          // Draw Fish School & Dolphin (Lower Half)
          if (!this.fish.eaten) {
            this.drawFishSchool(ctx, fishPxX, fishPxY, this.fish.finPhase);
          }
          this.drawDolphin(ctx, dolphinPxX, dolphinPxY, this.dolphin.finPhase, this.dolphin.mouthOpen);

          // Draw quick chomp visual bursts on capture
          this.drawChompBursts(ctx);

          // Draw Pointer Rays & Labels (Auto-fades out after 4 seconds)
          if (this.labelsOpacity > 0.01) {
            this.drawCalloutLabels(ctx, batPxX, batPxY, flyPxX, flyPxY, dolphinPxX, dolphinPxY, fishPxX, fishPxY);
          }
        }

        drawChompBursts(ctx) {
          for (const b of this.chompBursts) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, b.life);
            ctx.strokeStyle = b.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.stroke();

            // Comic-style chomp radial lines
            for (let k = 0; k < 8; k++) {
              const ang = (k / 8) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(b.x + Math.cos(ang) * (b.radius * 0.65), b.y + Math.sin(ang) * (b.radius * 0.65));
              ctx.lineTo(b.x + Math.cos(ang) * (b.radius * 1.3), b.y + Math.sin(ang) * (b.radius * 1.3));
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        drawCoral(ctx, x, baseY, scaleX) {
          ctx.save();
          ctx.translate(x, baseY);
          ctx.scale(scaleX, 1);
          ctx.strokeStyle = '#4e697a';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 15);
          ctx.quadraticCurveTo(-8, -35, 4, -85);
          ctx.moveTo(-2, -25);
          ctx.quadraticCurveTo(-28, -42, -26, -72);
          ctx.moveTo(2, -45);
          ctx.quadraticCurveTo(26, -58, 28, -88);
          ctx.stroke();
          ctx.restore();
        }

        /* --------------------------------------------------------------------
           CURVED SONAR (YELLOW) & RETURNING (RED) WAVE ARCS (Matches 8.jpg)
           -------------------------------------------------------------------- */
        drawEcholocationArcs(ctx, emitX, emitY, targetX, progress) {
          ctx.save();
          const span = Math.max(80, emitX - targetX);
          const totalArcs = 12;

          // Outgoing yellow arcs (progress 0 -> 1)
          const outP = Math.min(1, progress);
          const visibleOut = Math.floor(outP * totalArcs);

          for (let i = 1; i <= visibleOut; i++) {
            const frac = i / totalArcs;
            const r = frac * span;
            ctx.strokeStyle = '#f6e05e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(emitX, emitY, r, Math.PI - 0.36, Math.PI + 0.36);
            ctx.stroke();
          }

          // Returning red arcs reflected off obstacle (progress 1 -> 2)
          if (progress > 1) {
            const retP = Math.min(1, progress - 1);
            const visibleRet = Math.floor(retP * (totalArcs - 1));
            for (let j = 1; j <= visibleRet; j++) {
              const frac = j / totalArcs;
              const r = frac * span;
              ctx.strokeStyle = '#ff1e1e';
              ctx.lineWidth = 3;
              ctx.beginPath();
              // Reflected arcs curve back from the obstacle toward the animal
              ctx.arc(targetX, emitY, r, -0.34, 0.34);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        /* --------------------------------------------------------------------
           POINTER RAYS & LABELS (Disappear after 4 seconds)
           -------------------------------------------------------------------- */
        drawCalloutLabels(ctx, batX, batY, flyX, flyY, dolX, dolY, fishX, fishY) {
          ctx.save();
          ctx.globalAlpha = this.labelsOpacity;

          const callouts = [
            { px: batX + 10, py: batY - 25, lx: batX + 45, ly: batY - 85, text: 'Bat (Ultrasonic Emitter)' },
            { px: flyX, py: flyY - 22, lx: flyX - 10, ly: flyY - 75, text: 'Moth / Fly (Prey)' },
            { px: (batX + flyX) * 0.5, py: batY - 35, lx: (batX + flyX) * 0.5 - 30, ly: batY - 95, text: 'Echolocation & Reflected Waves' },
            { px: dolX + 10, py: dolY - 25, lx: dolX + 35, ly: dolY - 82, text: 'Dolphin (Sonar Emitter)' },
            { px: fishX, py: fishY - 28, lx: fishX - 15, ly: fishY - 82, text: 'Fish School (Prey)' },
            { px: (dolX + fishX) * 0.5, py: dolY - 38, lx: (dolX + fishX) * 0.5 - 30, ly: dolY - 96, text: 'Outgoing & Returning Sonar' }
          ];

          callouts.forEach((c) => {
            // Pointer ray
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(c.px, c.py);
            ctx.lineTo(c.lx, c.ly);
            ctx.stroke();

            // Target dot
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(c.px, c.py, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Label pill
            ctx.font = '600 13px "Fredoka", sans-serif';
            const textW = ctx.measureText(c.text).width;
            const boxX = c.lx - textW * 0.5 - 10;
            const boxY = c.ly - 24;

            ctx.fillStyle = 'rgba(15, 20, 30, 0.86)';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, textW + 20, 24, 7);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.fillText(c.text, boxX + 10, boxY + 16);
          });

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           ILLUSTRATED BAT (Matches 8.jpg)
           -------------------------------------------------------------------- */
        drawBat(ctx, x, y, phase, mouthOpen = 0) {
          ctx.save();
          const bob = Math.sin(phase * 0.5) * 5;
          ctx.translate(x, y + bob);
          const flap = Math.sin(phase);

          // Back wing
          ctx.save();
          ctx.rotate(flap * 0.28);
          ctx.fillStyle = '#1f1c1d';
          ctx.strokeStyle = '#111111';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-25, -12);
          ctx.lineTo(-68, -86);
          ctx.quadraticCurveTo(-76, -34, -56, -8);
          ctx.quadraticCurveTo(-40, -16, -25, -12);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          // Furry brown body & head
          ctx.fillStyle = '#7c4d2b';
          ctx.strokeStyle = '#181412';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 6, 44, 24, 0.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Head & Ears
          ctx.beginPath();
          ctx.arc(-44, -4, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Pointed ears
          ctx.beginPath();
          ctx.moveTo(-48, -18);
          ctx.lineTo(-52, -34);
          ctx.lineTo(-40, -21);
          ctx.moveTo(-38, -18);
          ctx.lineTo(-34, -33);
          ctx.lineTo(-28, -16);
          ctx.fill();
          ctx.stroke();

          // Eye & smiling/chomping snout
          ctx.fillStyle = '#111111';
          ctx.beginPath();
          ctx.arc(-52, -7, 2.5, 0, Math.PI * 2);
          ctx.fill();

          if (mouthOpen > 0.1) {
            ctx.fillStyle = '#991b1b';
            ctx.beginPath();
            ctx.arc(-56, 3, 6 + mouthOpen * 4, 0.2 * Math.PI, 1.3 * Math.PI);
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(-56, 4, 6, 0.1 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
          }

          // Front articulated bat wing (animated flapping)
          ctx.save();
          ctx.translate(-12, -6);
          ctx.rotate(-flap * 0.35);
          ctx.fillStyle = '#63534c';
          ctx.strokeStyle = '#181412';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(36, -68);
          ctx.lineTo(96, -96);
          ctx.quadraticCurveTo(82, -46, 86, -12);
          ctx.quadraticCurveTo(56, -22, 42, 4);
          ctx.quadraticCurveTo(22, -6, 0, 0);
          ctx.fill();
          ctx.stroke();

          // Wing bone ribs
          ctx.strokeStyle = '#9a6239';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(36, -68);
          ctx.lineTo(86, -12);
          ctx.moveTo(36, -68);
          ctx.lineTo(42, 4);
          ctx.stroke();
          ctx.restore();

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           ILLUSTRATED MOTH / FLY (Matches 8.jpg)
           -------------------------------------------------------------------- */
        drawFly(ctx, x, y, phase) {
          ctx.save();
          const flutter = Math.sin(phase * 0.4) * 4;
          ctx.translate(x, y + flutter);
          const wingAngle = Math.sin(phase) * 0.45;

          // Purple wings
          ctx.save();
          ctx.rotate(wingAngle);
          ctx.fillStyle = '#b4a7d6';
          ctx.strokeStyle = '#1c1926';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(-6, -12, 10, 20, -0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.rotate(-wingAngle * 0.7);
          ctx.fillStyle = '#9888c4';
          ctx.strokeStyle = '#1c1926';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(-2, -6, 9, 17, -0.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          // Segmented body
          ctx.fillStyle = '#675c82';
          ctx.strokeStyle = '#1c1926';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(4, 6, 6, 15, 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           ILLUSTRATED DOLPHIN (Matches 8.jpg)
           -------------------------------------------------------------------- */
        drawDolphin(ctx, x, y, phase, mouthOpen = 0) {
          ctx.save();
          const swimBob = Math.sin(phase * 0.6) * 6;
          const pitch = Math.cos(phase * 0.6) * 0.06;
          ctx.translate(x, y + swimBob);
          ctx.rotate(pitch);

          const tailFlex = Math.sin(phase) * 14;

          ctx.fillStyle = '#cde1f2';
          ctx.strokeStyle = '#1a232e';
          ctx.lineWidth = 2.6;
          ctx.lineJoin = 'round';

          // Streamlined dolphin body + beak + dorsal fin + animated tail fluke
          ctx.beginPath();
          // Beak tip (facing left)
          ctx.moveTo(-104, 8);
          ctx.quadraticCurveTo(-92, 2, -78, 0);
          // Forehead & back up to dorsal fin
          ctx.quadraticCurveTo(-56, -24, -14, -22);
          // Dorsal fin
          ctx.quadraticCurveTo(-4, -38, 8, -36);
          ctx.quadraticCurveTo(2, -24, 6, -18);
          // Tail stock curving to animated fluke
          ctx.quadraticCurveTo(54, -12, 86, -14 + tailFlex * 0.6);
          // Tail fluke
          ctx.quadraticCurveTo(106, -22 + tailFlex, 118, -10 + tailFlex);
          ctx.quadraticCurveTo(102, -4 + tailFlex, 94, -2 + tailFlex);
          ctx.quadraticCurveTo(104, 8 + tailFlex, 96, 16 + tailFlex);
          ctx.quadraticCurveTo(84, 4 + tailFlex * 0.7, 78, -2 + tailFlex * 0.5);
          // Belly curve
          ctx.quadraticCurveTo(36, 22, -16, 24);
          ctx.quadraticCurveTo(-64, 22, -84, 14);
          ctx.quadraticCurveTo(-98, 14, -104, 8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Lighter underbelly shading
          ctx.fillStyle = '#e6f1fa';
          ctx.beginPath();
          ctx.moveTo(-82, 12);
          ctx.quadraticCurveTo(-30, 22, 34, 12);
          ctx.quadraticCurveTo(-24, 14, -82, 12);
          ctx.fill();

          // Pectoral flipper (animated)
          ctx.save();
          ctx.translate(-34, 16);
          ctx.rotate(Math.sin(phase) * 0.25);
          ctx.fillStyle = '#bdd6eb';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(12, 18, 28, 22);
          ctx.quadraticCurveTo(22, 8, 12, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          // Eye & smiling/chomping mouth
          ctx.fillStyle = '#1a232e';
          ctx.beginPath();
          ctx.arc(-68, 2, 2.5, 0, Math.PI * 2);
          ctx.fill();

          if (mouthOpen > 0.1) {
            ctx.fillStyle = '#be123c';
            ctx.beginPath();
            ctx.moveTo(-103, 7 - mouthOpen * 4);
            ctx.lineTo(-78, 8);
            ctx.lineTo(-101, 10 + mouthOpen * 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(-102, 9);
            ctx.quadraticCurveTo(-88, 12, -76, 8);
            ctx.stroke();
          }

          ctx.restore();
        }

        /* --------------------------------------------------------------------
           ILLUSTRATED SCHOOL OF 3 ORANGE FISH (Matches 8.jpg)
           -------------------------------------------------------------------- */
        drawFishSchool(ctx, x, y, phase) {
          const offsets = [
            { dx: 12, dy: -16, scale: 1.0, p: 0 },
            { dx: -24, dy: 4, scale: 0.92, p: 1.4 },
            { dx: 12, dy: 24, scale: 0.86, p: 2.6 }
          ];

          offsets.forEach((f) => {
            ctx.save();
            const bob = Math.sin(phase * 0.7 + f.p) * 3.5;
            ctx.translate(x + f.dx, y + f.dy + bob);
            ctx.scale(f.scale, f.scale);

            const tailWag = Math.sin(phase + f.p) * 4;

            ctx.fillStyle = '#f59e0b';
            ctx.strokeStyle = '#1c1917';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            // Tail fin (on left, facing right toward dolphin)
            ctx.beginPath();
            ctx.moveTo(-14, 0);
            ctx.lineTo(-24, -10 + tailWag);
            ctx.lineTo(-21, 0);
            ctx.lineTo(-24, 10 + tailWag);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Top & bottom fins
            ctx.beginPath();
            ctx.moveTo(-4, -10);
            ctx.lineTo(-8, -18);
            ctx.lineTo(4, -10);
            ctx.moveTo(-4, 10);
            ctx.lineTo(-8, 17);
            ctx.lineTo(4, 10);
            ctx.stroke();

            // Fish body
            ctx.beginPath();
            ctx.ellipse(2, 0, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Gill & eye
            ctx.beginPath();
            ctx.arc(7, 0, 7, Math.PI * 0.65, Math.PI * 1.35);
            ctx.stroke();

            ctx.fillStyle = '#1c1917';
            ctx.beginPath();
            ctx.arc(11, -3, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          });
        }
      }

      // Instantiate both simulation engines
      const wavesSim = new WavesSimulation();
      const realSim = new RealExampleSimulation();

      // Initial render
      wavesSim.draw();
      realSim.draw();
    })();
  </script>
